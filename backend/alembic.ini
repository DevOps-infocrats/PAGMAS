# Database migrations (Alembic). The database URL is NOT here – migrations/env.py takes it from DATABASE_URL in .env.
# Run from backend/:  .venv\Scripts\alembic upgrade head

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# 0002_short_name.py – revisions are numbered by hand: alembic revision --autogenerate --rev-id 0002 -m "short name"
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 40
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
