# Public entry point: TLS + client IP for the API's rate limits and audit log.
# Browser -> nginx (443) -> Next.js (3000) -> /api/* proxied to FastAPI (8010).
# Only nginx is reachable from outside; 3000 and 8010 stay on localhost / the private network.

upstream pratap_frontend {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name analytics.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name analytics.example.com;

    ssl_certificate     /etc/ssl/certs/pratap.crt;
    ssl_certificate_key /etc/ssl/private/pratap.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    # Workbook uploads (keep in line with MAX_UPLOAD_MB in backend/.env).
    client_max_body_size 64m;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://pratap_frontend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Appends the real client address; the API trusts only the right-most untrusted hop.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
