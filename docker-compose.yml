version: '3.8'

services:
  # 1. Next.js Frontend App (Exposed on Port 8001)
  frontend:
    build:
      context: ./frontend
      dockerfile: ../deployment/docker/frontend.Dockerfile
    ports:
      - "127.0.0.1:8001:3000"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    restart: unless-stopped

  # 2. Python Gunicorn Backend Engine (Exposed on Port 8002)
  backend:
    build:
      context: ./backend
      dockerfile: ../deployment/docker/backend.Dockerfile
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://partap_db:PRATAPDB_2026%40%23%26_SECURE@postgres:5432/partap_db
      - ADMIN_PASSWORD_HASH=$$argon2id$$v=19$$m=65536,t=3,p=4$$j+Nv/+xVGAfKnupqS5Vnkw$$4NWX4U/pHqdomYi1Xt1vi6CINqoZve74iGzAg5O/7MQ
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # 3. Database Container running Postgres 15 (Hooked to external volume)
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: partap_db
      POSTGRES_USER: partap_db
      POSTGRES_PASSWORD: PRATAPDB_2026@#&_SECURE
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pagmas"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    external: true
    name: pagmas_db_data

